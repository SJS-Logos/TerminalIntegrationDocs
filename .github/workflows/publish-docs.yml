name: Publish Docs to Confluence

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'examples/**'
      - '.markdown-confluence.json'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    name: Publish docs
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate markdown files are UTF-8
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path('README.md')]
          candidates.extend(Path('docs').rglob('*.md'))
          candidates.extend(Path('examples').rglob('*.md'))

          invalid = []
          for path in candidates:
              if not path.exists():
                  continue
              try:
                  path.read_text(encoding='utf-8')
              except UnicodeDecodeError as ex:
                  invalid.append(f"{path}: {ex}")

          if invalid:
              print('Found markdown files that are not valid UTF-8:')
              for row in invalid:
                  print(row)
              raise SystemExit(1)

          print('README.md, docs, and examples markdown files are valid UTF-8.')
          PY

      - name: Build deterministic publish folder
        shell: bash
        run: |
          rm -rf .confluence-publish
          mkdir -p .confluence-publish

          python3 - <<'PY'
          from pathlib import Path
          import shutil

          publish_root = Path('.confluence-publish')
          readme = Path('README.md').read_text(encoding='utf-8')
          readme = readme.replace('(docs/', '(').replace('(./docs/', '(./')

          publish_root.mkdir(parents=True, exist_ok=True)
          (publish_root / 'README.md').write_text(readme, encoding='utf-8')

          docs_root = Path('docs')
          if docs_root.exists():
              for source in sorted(docs_root.rglob('*')):
                  if not source.is_file():
                      continue

                  target = publish_root / source.relative_to(docs_root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)

          examples_root = Path('examples')
          if examples_root.exists():
              for source in sorted(examples_root.rglob('*')):
                  if not source.is_file():
                      continue

                  target = publish_root / 'examples' / source.relative_to(examples_root)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(source, target)
          PY

      - name: Prepare publish config
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path('.markdown-confluence.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['folderToPublish'] = '.confluence-publish'
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish markdown to Confluence
        uses: markdown-confluence/publish-action@v5
        with:
          atlassianusername: ${{ vars.atlassian_username }}
          atlassianapitoken: ${{ secrets.atlassian_api_token }}
